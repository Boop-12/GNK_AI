name: Deploy Oracle production
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: oracle-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require successful cloud verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          result=$(gh run list --repo "$REPO" --commit "$COMMIT" --workflow ci.yml --limit 10 --json conclusion,status --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          test "$result" -gt 0 || { echo 'Cloud verification must pass before deployment.'; exit 1; }
      - name: Configure SSH with pinned host identity
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy verified source on Oracle VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$ORACLE_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] && [[ "$ORACLE_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/gnkalgo_AI
          test "$(git remote get-url origin)" = 'https://github.com/Boop-12/GNK_AI.git'
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=no)"
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$1"
          bash scripts/deploy-production.sh
          REMOTE
