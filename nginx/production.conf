server {
    listen 80 default_server;
    server_name gnkalgo.com www.gnkalgo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://www.gnkalgo.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _ gnkalgo.com;

    ssl_certificate /etc/letsencrypt/live/gnkalgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnkalgo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    return 308 https://www.gnkalgo.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.gnkalgo.com;
    client_max_body_size 32k;

    ssl_certificate /etc/letsencrypt/live/gnkalgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnkalgo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Authorization codes must not be written to proxy request/error logs.
    location = /api/v1/brokers/fyers/oauth/callback {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
