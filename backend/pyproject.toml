[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gnkalgo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3", "pwdlib[argon2]>=0.2,<1", "PyJWT[crypto]>=2.9,<3",
  "redis>=5,<7", "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
